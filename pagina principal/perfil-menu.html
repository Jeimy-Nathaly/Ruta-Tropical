<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · RuTa Tropical</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="rt-fondo-ambiental" aria-hidden="true">
    <div class="rt-resplandor-izq"></div>
    <div class="rt-resplandor-der"></div>
  </div>

  <!-- ENCABEZADO SUPERIOR DE LA PÁGINA CON LOGO -->
  <header class="rt-header-top">
    <a href="../pagina principal/Inicio.html" class="rt-logo-enlace" title="Volver a la página principal">
      <span class="rt-logo-icono">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
        </svg>
      </span>
      <span class="rt-logo-texto">RuTa Tropical</span>
    </a>
  </header>

  <main class="rt-grid-centrado">
    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <section class="rt-lado-formulario">
      <div id="rtAuthMensaje" class="rt-alerta-top"></div>

      <div class="rt-tarjeta-auth rt-anim-entrada">
        <div class="rt-encabezado-auth">
          <h1 id="tituloAuth">Iniciar sesión<span>.</span></h1>
          <p id="subtituloAuth">Ingresa tus datos para acceder a tu cuenta y tus rutas.</p>
        </div>

        <div class="rt-tabs-switch" role="tablist">
          <button type="button" id="tabLogin" class="rt-tab-btn activa" role="tab" aria-selected="true">
            Iniciar sesión
          </button>
          <button type="button" id="tabRegistro" class="rt-tab-btn" role="tab" aria-selected="false">
            Crear cuenta
          </button>
        </div>

        <!-- FORMULARIO INICIAR SESIÓN -->
        <form id="formLogin" class="rt-form-panel">
          <div class="rt-campo-bloque">
            <label for="loginCorreo" class="rt-etiqueta-campo">Correo electrónico</label>
            <div class="rt-campo-animado">
              <span class="rt-icono-izq">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
              </span>
              <input type="email" id="loginCorreo" class="rt-input-tropical" placeholder="correo@ejemplo.com" required />
            </div>
          </div>

          <div class="rt-campo-bloque">
            <div class="rt-fila-label">
              <label for="loginPass" class="rt-etiqueta-campo">Contraseña</label>
              <button type="button" id="btnModoExplorador" class="rt-link-accion">Modo Explorador</button>
            </div>
            <div class="rt-campo-animado">
              <span class="rt-icono-izq">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="loginPass" class="rt-input-tropical rt-con-ojo" placeholder="Ingresa tu contraseña" required />
              <button type="button" class="rt-ver-ojo" data-target="loginPass" title="Mostrar/ocultar contraseña" aria-label="Mostrar/ocultar contraseña">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="rt-btn-tropical">
            <span>Iniciar sesión</span>
            <svg class="rt-flecha-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
        </form>

        <!-- FORMULARIO CREAR CUENTA (REGISTRO) -->
        <form id="formRegistro" class="rt-form-panel oculto">
          <div class="rt-campo-bloque">
            <label for="regNombre" class="rt-etiqueta-campo">Nombre o usuario</label>
            <div class="rt-campo-animado">
              <span class="rt-icono-izq">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input type="text" id="regNombre" class="rt-input-tropical" placeholder="Tu nombre o usuario" required />
            </div>
          </div>

          <div class="rt-campo-bloque">
            <label for="regCorreo" class="rt-etiqueta-campo">Correo electrónico</label>
            <div class="rt-campo-animado">
              <span class="rt-icono-izq">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
              </span>
              <input type="email" id="regCorreo" class="rt-input-tropical" placeholder="correo@ejemplo.com" required />
            </div>
          </div>

          <div class="rt-campo-bloque">
            <label for="regPass" class="rt-etiqueta-campo">Contraseña</label>
            <div class="rt-campo-animado">
              <span class="rt-icono-izq">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="regPass" class="rt-input-tropical rt-con-ojo" placeholder="Mínimo 4 caracteres" minlength="4" required />
              <button type="button" class="rt-ver-ojo" data-target="regPass" title="Mostrar/ocultar contraseña" aria-label="Mostrar/ocultar contraseña">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="rt-btn-tropical">
            <span>Crear cuenta</span>
            <svg class="rt-flecha-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
        </form>

       <!-- O CONTINÚA CON INSTAGRAM / GOOGLE -->
        <div class="rt-separador-social"><span>o continúa con</span></div>

        <div class="rt-social-grid">
          <a href="oauth.html?provider=instagram" class="rt-btn-social">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#DD4350" />
                  <stop offset="50%" stop-color="#E2837D" />
                  <stop offset="100%" stop-color="#17A1CF" />
                </linearGradient>
              </defs>
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="url(#igGrad)" stroke-width="2.1" />
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="url(#igGrad)" stroke-width="2.1" />
              <circle cx="17.3" cy="6.7" r="1.2" fill="#DD4350" />
            </svg>
            <span>Instagram</span>
          </a>

          <a href="oauth.html" class="rt-btn-social">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#17A1CF" d="M21.6 12.23c0-.68-.06-1.36-.18-2.01H12v3.8h5.39a4.61 4.61 0 0 1-2 3.02v2.5h3.23c1.89-1.74 2.98-4.3 2.98-6.79z" />
              <path fill="#81BAC2" d="M12 22c2.7 0 4.97-.9 6.62-2.44l-3.23-2.5c-.9.6-2.05.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H3.06v2.58A10 10 0 0 0 12 22z" />
              <path fill="#FADADA" d="M6.4 13.88a6.01 6.01 0 0 1 0-3.76V7.54H3.06a10 10 0 0 0 0 8.92l3.34-2.58z" />
              <path fill="#DD4350" d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.95 9.95 0 0 0 12 2a10 10 0 0 0-8.94 5.54l3.34 2.58c.79-2.36 3-4.14 5.6-4.14z" />
            </svg>
            <span>Google</span>
          </a>
        </div>

    <!-- COLUMNA DERECHA: ESFERA GRANDE Y AVIÓN DE VIAJE -->
    <section class="rt-lado-visual" aria-hidden="true">
      <div class="rt-masa-viaje">
        <div class="rt-fluido-capa c1"></div>
        <div class="rt-fluido-capa c2"></div>
        <div class="rt-fluido-capa c3"></div>

        <div class="rt-onda-radar o1"></div>
        <div class="rt-onda-radar o2"></div>

        <div class="rt-anillo-ruta r1"></div>
        <div class="rt-anillo-ruta r2"></div>

        <div class="rt-avion-grande-centro">
          <span class="rt-estela-centro"></span>
          <svg viewBox="0 0 180 96" width="220" height="118">
            <path d="M 24 44 L 8 20 L 22 20 L 40 44 Z" fill="#DD4350" />
            <path d="M 28 48 L 14 62 L 24 62 L 42 49 Z" fill="#E2837D" />
            <path
              d="M 18 46 Q 18 39 30 39 L 136 39 Q 164 39 172 48 Q 164 56 136 56 L 30 56 Q 18 56 18 46 Z"
              fill="#F9FAFB"
              stroke="#81BAC2"
              stroke-width="1.5"
            />
            <path d="M 22 49 L 158 49 Q 152 53 136 53 L 26 53 Z" fill="#17A1CF" />
            <g fill="#0F172A" opacity="0.72">
              <rect x="118" y="43" width="5" height="4" rx="1.5" />
              <rect x="108" y="43" width="5" height="4" rx="1.5" />
              <rect x="98" y="43" width="5" height="4" rx="1.5" />
              <rect x="88" y="43" width="5" height="4" rx="1.5" />
              <rect x="78" y="43" width="5" height="4" rx="1.5" />
              <rect x="68" y="43" width="5" height="4" rx="1.5" />
              <rect x="58" y="43" width="5" height="4" rx="1.5" />
              <rect x="48" y="43" width="5" height="4" rx="1.5" />
            </g>
            <path d="M 148 41 L 158 43 L 155 46 L 147 46 Z" fill="#0F172A" />
            <path d="M 74 47 L 48 16 L 66 16 L 98 47 Z" fill="#FFFFFF" stroke="#81BAC2" stroke-width="1.5" />
            <path d="M 78 51 L 56 78 L 74 78 L 102 51 Z" fill="#FADADA" stroke="#E2837D" stroke-width="1.2" />
            <rect x="84" y="54" width="18" height="9" rx="4" fill="#17A1CF" />
          </svg>
        </div>
      </div>

      <div class="rt-pie-visual">
        <strong>RuTa Tropical</strong> · Explora destinos, rutas y mapas interactivos en un solo lugar.
      </div>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
